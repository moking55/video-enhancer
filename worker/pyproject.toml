[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enhancer-worker"
version = "0.1.0"
description = "GPU-side worker for the Video Enhancer (runs from a Colab notebook)"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
enhancer-worker = "enhancer_worker.cli:main"

[tool.setuptools.packages.find]
include = ["enhancer_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
